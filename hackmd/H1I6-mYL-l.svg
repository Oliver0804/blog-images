<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="72" y="74" fill="#e5e7eb" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-weight="700">
    everything-claude-code：組件如何串成工作流
  </text>
  <rect x="72" y="92" width="420" height="8" rx="4" fill="url(#chip)" opacity="0.9"/>

  <!-- center: Claude Code session -->
  <g transform="translate(430,270)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="170" rx="18" fill="#0b0f16" stroke="#334155" stroke-width="2"/>
    <text x="26" y="52" fill="#e5e7eb" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-weight="700">
      Claude Code Session
    </text>
    <text x="26" y="86" fill="#94a3b8" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      tools + context window + permissions
    </text>
    <rect x="26" y="112" width="288" height="38" rx="12" fill="#111827" stroke="#1f2937"/>
    <text x="44" y="136" fill="#a7f3d0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      goal: stable delivery, not just code gen
    </text>
  </g>

  <!-- nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <!-- commands -->
    <g transform="translate(80,160)" filter="url(#shadow)">
      <rect x="0" y="0" width="310" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">commands</text>
      <text x="20" y="70" fill="#93c5fd" font-size="13">/plan /tdd /e2e /code-review</text>
      <text x="20" y="92" fill="#93c5fd" font-size="13">/build-fix /setup-pm ...</text>
    </g>

    <!-- agents -->
    <g transform="translate(80,320)" filter="url(#shadow)">
      <rect x="0" y="0" width="310" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">agents</text>
      <text x="20" y="70" fill="#fcd34d" font-size="13">planner / architect / reviewer</text>
      <text x="20" y="92" fill="#fcd34d" font-size="13">build-error-resolver ...</text>
    </g>

    <!-- skills -->
    <g transform="translate(80,480)" filter="url(#shadow)">
      <rect x="0" y="0" width="310" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">skills</text>
      <text x="20" y="70" fill="#a7f3d0" font-size="13">tdd-workflow / security-review</text>
      <text x="20" y="92" fill="#a7f3d0" font-size="13">verification-loop / learn ...</text>
    </g>

    <!-- hooks -->
    <g transform="translate(820,190)" filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="140" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">hooks</text>
      <text x="20" y="70" fill="#67e8f9" font-size="13">SessionStart / SessionEnd</text>
      <text x="20" y="92" fill="#67e8f9" font-size="13">PreToolUse / PostToolUse</text>
      <text x="20" y="114" fill="#67e8f9" font-size="13">Stop / PreCompact (guardrails)</text>
    </g>

    <!-- rules -->
    <g transform="translate(820,360)" filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">rules</text>
      <text x="20" y="70" fill="#cbd5e1" font-size="13">security / testing / git-workflow</text>
      <text x="20" y="92" fill="#cbd5e1" font-size="13">coding-style / performance ...</text>
    </g>

    <!-- mcp -->
    <g transform="translate(820,520)" filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="120" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
      <text x="20" y="40" fill="#e5e7eb" font-size="18" font-weight="700">MCP configs</text>
      <text x="20" y="70" fill="#fca5a5" font-size="13">GitHub / search / db / deploy</text>
      <text x="20" y="92" fill="#fca5a5" font-size="13">"configure many, enable few"</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M390 220 C 430 220, 430 270, 430 310"/>
    <path d="M390 380 C 430 380, 430 360, 430 360"/>
    <path d="M390 540 C 430 540, 430 440, 430 440"/>

    <path d="M770 330 C 820 330, 820 260, 820 260"/>
    <path d="M770 355 C 820 355, 820 420, 820 420"/>
    <path d="M770 410 C 820 410, 820 580, 820 580"/>
  </g>

  <!-- caption -->
  <text x="72" y="670" fill="#94a3b8" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    設計要點：commands/agents/skills 讓流程可重複；hooks 讓品質可驗證；MCP 擴充能力但要控工具數量。
  </text>
</svg>
